<div class="dropdown" style="z-index: 2000; height: 100%; width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;">
  <button class="dropbtn">Other Things</button>
  <div class="dropdown-content">
  {%- for path in include.paths -%}
  {%- assign hyperpage = site.pages | where: "path", path | first -%}
  {%- if hyperpage.title %}
    {%- if hyperpage.tags == "menu" -%}
  <a class="nav-item" href="{{ hyperpage.url | relative_url }}">{{ hyperpage.title | escape }}</a>
    {%- endif -%}
  {%- endif -%}
  {%- endfor %}
  </div>
</div>
