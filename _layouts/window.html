<div class="main-page-content">
  {{ content }}
</div>

<!-- 1. Added display flex, centering, and padding to the overlay -->
<div id="customWindow" class="window-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 4000; align-items: flex-start; justify-content: center; overflow-y: auto; padding-top: 5vh;">
  
  <!-- 2. Added max-height, overflow, and removed absolute positioning if any was used -->
  <div class="window-content" style="z-index: 5000; background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; box-sizing: border-box;">
    <span class="close-btn" onclick="closeWindow()">&times;</span>
    <h2>{{ page.window_title }}</h2>
    <div>
      {%- assign about_page = site.pages | where: "path", "about.md" | first -%}
      {%- if about_page -%}
        {{ about_page.content | markdownify }}
      {%- endif -%}
    </div>
  </div>
</div>

<script>
  function openWindow() {
    // Changed to 'flex' to match the alignment styles above
    document.getElementById("customWindow").style.style.display = "flex"; 
  }
  function closeWindow() {
    document.getElementById("customWindow").style.display = "none";
  }
</script>
